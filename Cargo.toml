[package]
name = "ZeltaHelper"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros", "time"] }
litcrypt = "0.4"
aes = "0.7"
aes-gcm = "0.10"
winreg = "0.55.0"
tokio-tungstenite = "0.20"
futures-util = "0.3"
url = "2.5.7"
sysinfo = "0.37.2"
notify-rust = "4.11.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rodio = { version = "0.21.0", default-features = false, features = ["symphonia-all", "playback"] }
tempfile = "3.24.0"
wallpaper = "3.2.0"
dunce = "1.0.5"
windows-sys = { version = "0.61.2", features = ["Win32_UI", "Win32_UI_WindowsAndMessaging"] }
base64 = "0.22.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
strip = true
