[package]
name = "ZeltaHelper"
version = "0.1.0"
edition = "2024"
description = "System helper"

[[bin]]
name = "ZeltaHelper"

[dependencies]
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros", "time"] }
litcrypt = "0.4"
aes-gcm = "0.10"
winreg = "0.55.0"
tokio-tungstenite = "0.20"
futures-util = "0.3"
sysinfo = "0.37.2"
notify-rust = "4.11.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rodio = { version = "0.21.0", default-features = false, features = ["symphonia-all", "playback"] }
tempfile = "3.24.0"
wallpaper = "3.2.0"
dunce = "1.0.5"
windows-sys = { version = "0.61.2", features = ["Win32_UI", "Win32_UI_WindowsAndMessaging"] }
base64 = "0.22.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Foundation", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_Devices", "Win32_Devices_FunctionDiscovery"] }
windows-registry = "0.6.1"
system_shutdown = "4.0.1"
auto-launch = "0.6.0"

[profile.release]
strip = true
