[package]
name = "winprankrpt-server"
version = "0.1.2"
edition = "2024"
authors = ["broke_off"]
repository = "https://github.com/broke-off/winprank"

[dependencies]
tokio = { version =  "1.8", features = ["rt-multi-thread", "macros"] }
teloxide = { git = "https://github.com/teloxide/teloxide.git", features = ["macros"] }
log = "0.4"
pretty_env_logger = "0.5"
serde = { version = "1.0.228", features = ["derive"] }
axum = { version = "0.8.8", features = ["ws"] }
toml = "0.9.10+spec-1.1.0"
sysinfo = "0.37.2"
aes-gcm = "0.10"
serde_json = "1.0.148"
futures-util = "0.3.31"
uuid = { version = "1.19.0", features = ["v4"] }
chrono = "0.4.42"
rand = "0.9.2"
base64 = "0.22.1"
country-emoji = "0.3.2"
rust-i18n = "3.1.5"

[build-dependencies]
winresource = "0.1.28"
